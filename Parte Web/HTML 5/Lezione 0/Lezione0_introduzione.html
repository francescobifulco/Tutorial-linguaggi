<!-- Indica al browser che il documento è scritto in HTML5 -->
<!DOCTYPE html>

<!-- Apertura del tag principale HTML e specificazione della lingua italiana -->
<html lang="it">

    <!-- La sezione 'head' contiene i metadati e le informazioni non visibili 
    direttamente nella pagina -->
    <head>
        <!-- Imposta la codifica dei caratteri su UTF-8 per supportare 
        correttamente le lettere accentate -->
        <meta charset="UTF-8">
        
        <!-- Definisce il titolo del documento visibile sulla 
        scheda del browser -->
        <title>Esempio di Pagina Web</title>
    </head>

    <!-- La sezione 'body' racchiude tutto il contenuto visibile 
    della pagina web -->
    <body>
        
        <!-- 'h1' rappresenta l'intestazione principale (Titolo di livello 1) -->
        <h1>Ciao dal file di testo</h1>
        
        <!-- 'h2' rappresenta un sotto-titolo 
         (Titolo di livello 2) -->
        <h2>Ciao, questo è un sottotitolo</h2>

    <!-- Chiusura della sezione 'body' -->
    </body>

<!-- Chiusura del tag principale 'html' -->
</html>
