<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cominciare con l'HTML</title>
</head>

<body>

    <!-- Contenitore generico di tipo blocco per raggruppare altri elementi -->
    <div>
        <!-- Paragrafo di testo con all'interno una parola in grassetto 
        marcata da <strong> -->
        <p><strong>Questo</strong> è un paragrafo</p>
    </div>
    
    <!-- Elemento in linea che applica un'importanza forte al testo 
    (reso in grassetto) -->
    <strong>first</strong>

    <!-- Link/collegamento ipertestuale (l'attributo href vuoto punta 
    alla pagina corrente) -->
    <a href="#">second</a>

    <!-- Elemento in linea per applicare un'enfasi sul testo 
    (reso in corsivo) -->
    <em>third</em>

    <!-- Tag 'i' per rendere il testo in corsivo 
    (usato per termini tecnici, parole straniere o pensieri) -->
    <i>ciao</i>

    <!-- Paragrafi distinti 
    (elementi di tipo blocco, ognuno va su una nuova riga) -->
    <p>fourth</p>
    <p>fifth</p>
    <p>sixth</p>

    <!-- Tag per inserire un'immagine. 'src' indica il percorso del file, 
    'alt' contiene il testo alternativo per accessibilità e SEO -->
    <img src="logo-design3d-logo-mockuplogo-design-illustrator_1029974-4389.jpg" alt="Logo promozionale 3D">

    <!-- Commento HTML: non viene mostrato a schermo -->
    <!-- Questo è un commento -->

</body>

</html>
